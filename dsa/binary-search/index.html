<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Binary Search Dry Runs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Layout: one study column. Problem picker, then the stage (array / grid / number line + pointers), helper panel, caption beside code, sticky controls. */
:root {
  --bg: #f4f5f8; --surface: #ffffff; --ink: #1b2230; --muted: #5d6676; --line: #d6dbe3;
  --low: #2f6fdf; --mid: #c8701c; --high: #1a8f61; --alt: #8a4fd0;
  --gone-bg: #eceef2; --gone-ink: #a9b0bc;
  --ok: #1a8f61; --ok-bg: #e2f4ec; --bad: #cf3f3f; --bad-bg: #fbe6e6;
  --band: #e3edff; --band2: #f1e8fb;
  --found: #f2c14e; --found-ink: #1b2230; --hot-bg: #fff1e3;
  --code-bg: #161b26; --code-ink: #cfd5e1; --code-dim: #7d8699; --code-hi: #3a3027; --code-hi-ink: #ffd9b3; --code-fn: #8fb8ff;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f131b; --surface: #171c26; --ink: #e6e9ef; --muted: #98a1b2; --line: #2b3242;
  --low: #6b9cff; --mid: #f0a052; --high: #47c48f; --alt: #b88cf0;
  --gone-bg: #1b2029; --gone-ink: #4f5768;
  --ok: #47c48f; --ok-bg: #16302a; --bad: #ff7a7a; --bad-bg: #3a1d22;
  --band: #1c2a45; --band2: #2b2140;
  --found: #e0b040; --found-ink: #14181f; --hot-bg: #3a2a1a;
  --code-bg: #0b0e14; --code-ink: #cfd5e1; --code-dim: #6c7588; --code-hi: #3a2d22; --code-hi-ink: #ffd2a6; --code-fn: #8fb8ff;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f131b; --surface: #171c26; --ink: #e6e9ef; --muted: #98a1b2; --line: #2b3242;
  --low: #6b9cff; --mid: #f0a052; --high: #47c48f; --alt: #b88cf0;
  --gone-bg: #1b2029; --gone-ink: #4f5768;
  --ok: #47c48f; --ok-bg: #16302a; --bad: #ff7a7a; --bad-bg: #3a1d22;
  --band: #1c2a45; --band2: #2b2140;
  --found: #e0b040; --found-ink: #14181f; --hot-bg: #3a2a1a;
  --code-bg: #0b0e14; --code-ink: #cfd5e1; --code-dim: #6c7588; --code-hi: #3a2d22; --code-hi-ink: #ffd2a6; --code-fn: #8fb8ff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.5; }
.wrap { max-width: 980px; margin: 0 auto; padding-block: 20px 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.picker { display: flex; gap: 6px; align-items: center; flex: 1 1 320px; justify-content: flex-end; min-width: 0; }
.picker select { flex: 1 1 auto; min-width: 0; max-width: 460px; font: 600 14px var(--sans); color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.iconbtn { font: 600 14px var(--sans); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 11px; cursor: pointer; }
.iconbtn:disabled { opacity: .4; cursor: default; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--low); outline-offset: 2px; }
.family { margin-top: 16px; font-size: 13px; color: var(--mid); font-weight: 600; }
h1 { font-size: clamp(22px, 4vw, 30px); line-height: 1.2; margin: 2px 0 2px; text-wrap: balance; }
h1 .lvl { font-size: 13px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; vertical-align: middle; margin-left: 6px; }
.sub { color: var(--muted); font-family: var(--mono); font-size: 14px; overflow-wrap: anywhere; white-space: pre-wrap; }

.stage { margin-top: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; min-height: 120px; }
.rowlabel { color: var(--muted); font-size: 14px; margin-bottom: 4px; }
.status { font-family: var(--mono); font-size: clamp(13px, 2.2vw, 16px); font-weight: 700; text-align: center; min-height: 1.6em; margin-bottom: 4px; overflow-wrap: anywhere; }
.track { position: relative; margin: 0 auto; }
.prow { position: relative; height: 54px; }
.ptr { position: absolute; top: 0; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center;
  font: 700 13px var(--sans); transition: left .55s cubic-bezier(.4,0,.2,1), opacity .3s; white-space: nowrap; }
.ptr svg { width: 14px; height: 26px; display: block; }
.c-low { color: var(--low); } .c-mid { color: var(--mid); } .c-high { color: var(--high); } .c-alt { color: var(--alt); }
.prow.down .ptr { justify-content: flex-end; top: auto; bottom: 0; }
.cells { display: grid; gap: 6px; }
.cell { aspect-ratio: 1; border: 2px solid var(--ink); border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  position: relative; font-weight: 700; font-size: clamp(13px, 3vw, 24px); background: var(--surface); font-variant-numeric: tabular-nums;
  transition: background-color .4s, color .4s, border-color .4s; min-width: 0; line-height: 1.1; }
.cell .cs { font-size: clamp(9px, 1.4vw, 12px); font-weight: 500; color: var(--muted); margin-top: 2px; text-align: center; }
.cell .idx { position: absolute; bottom: -20px; font-size: 11px; color: var(--muted); font-weight: 500; }
.cell.band { background: var(--band); } .cell.band2 { background: var(--band2); }
.cell.yes { background: var(--ok-bg); } .cell.no { background: var(--bad-bg); }
.cell.gone { background: var(--gone-bg); color: var(--gone-ink); border-color: var(--gone-ink); }
.cell.gone .cs { color: var(--gone-ink); }
.cell.found { background: var(--found); color: var(--found-ink); border-color: var(--ink); }
.cell.found .cs { color: var(--found-ink); }
.cell .mark { position: absolute; right: -6px; bottom: -6px; width: 18px; height: 18px; border-radius: 50%; color: #fff;
  font-size: 11px; display: flex; align-items: center; justify-content: center; font-weight: 700; }
.mark.yes { background: var(--ok); } .mark.no { background: var(--bad); }
.has-idx .prow.up { margin-top: 18px; }
.tags { position: absolute; top: 3px; left: 3px; right: 3px; display: flex; flex-wrap: wrap; gap: 2px; }
.tags span { font: 700 10px var(--sans); color: #fff; border-radius: 4px; padding: 0 4px; line-height: 15px; }
.bg-low { background: var(--low); } .bg-mid { background: var(--mid); } .bg-high { background: var(--high); } .bg-alt { background: var(--alt); }

.gridwrap { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 10px; align-items: center; margin: 0 auto; }
.gridwrap .rlab { display: flex; gap: 4px; justify-content: flex-end; min-width: 44px; }
.gridwrap .rlab span { font: 700 11px var(--sans); color: #fff; border-radius: 4px; padding: 1px 5px; }
.grow { display: grid; gap: 6px; }
.grid .cell { font-size: clamp(13px, 2.6vw, 22px); }

.axis { position: relative; height: 44px; margin: 0 8px; }
.axis .bar { position: absolute; left: 0; right: 0; top: 18px; height: 8px; border-radius: 4px; background: var(--gone-bg); }
.axis .win { position: absolute; top: 15px; height: 14px; border-radius: 6px; background: var(--band); border: 2px solid var(--low);
  transition: left .55s cubic-bezier(.4,0,.2,1), width .55s cubic-bezier(.4,0,.2,1); }
.axis .tick { position: absolute; top: 32px; transform: translateX(-50%); font: 12px var(--mono); color: var(--muted); }
.axis .dot { position: absolute; top: 12px; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; color: #fff; font: 700 11px var(--sans);
  display: flex; align-items: center; justify-content: center; border: 2px solid var(--surface); }
.axis .dot.found { background: var(--found); color: var(--found-ink); }
.axis .dlab { position: absolute; top: -6px; transform: translateX(-50%); font: 700 11px var(--mono); color: var(--muted); }
.line-track { margin: 0 8px; }

.panel { margin-top: 14px; border-top: 1px dashed var(--line); padding-top: 14px; display: grid; gap: 10px; }
.panel .ptitle { font-size: 14px; color: var(--muted); font-family: var(--mono); overflow-wrap: anywhere; }
.panel .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: stretch; }
.pile { border: 1.5px solid var(--line); border-radius: 8px; padding: 6px 10px; min-width: 92px; text-align: center; background: var(--surface); }
.pile b { display: block; font-size: 14px; }
.pile span { font-family: var(--mono); font-size: 12px; color: var(--muted); min-height: 1.4em; display: block; overflow-wrap: anywhere; }
.pile.hot { border-color: var(--mid); background: var(--hot-bg); }
.pile.hot span { color: var(--ink); font-weight: 700; }
.result { border: 1.5px solid var(--line); border-radius: 8px; padding: 6px 14px; min-width: 160px; }
.result b { display: block; font-family: var(--mono); }
.result span { font-size: 13px; font-weight: 600; color: var(--muted); }
.result.ok { border-color: var(--ok); background: var(--ok-bg); } .result.ok span { color: var(--ok); }
.result.bad { border-color: var(--bad); background: var(--bad-bg); } .result.bad span { color: var(--bad); }
.var { padding: 2px 8px; } .var small { display: block; color: var(--muted); font-size: 12px; font-family: var(--mono); }
.var b { font-size: 24px; font-variant-numeric: tabular-nums; }

.lower { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 14px; margin-top: 14px; }
@media (max-width: 760px) { .lower { grid-template-columns: minmax(0, 1fr); } }
.caption { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.caption .tag { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--mid); margin-bottom: 4px; overflow-wrap: anywhere; }
.caption p { margin: 0; font-size: 17px; max-width: 60ch; }
.code { background: var(--code-bg); border-radius: 10px; min-width: 0; overflow: hidden; }
.code .fn { font: 700 12px var(--mono); color: var(--code-fn); padding: 10px 14px 0; overflow-wrap: anywhere; }
.code pre { margin: 0; padding: 8px 0 12px; overflow-x: auto; font: 13px/1.6 var(--mono); color: var(--code-ink); }
.code .ln { display: block; padding: 0 14px; border-left: 3px solid transparent; white-space: pre; min-width: max-content; }
.code .ln.hi { background: var(--code-hi); color: var(--code-hi-ink); border-left-color: var(--mid); font-weight: 700; }

.card h2 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--low); margin: 18px 0 4px; }
.card h2:first-of-type { margin-top: 0; }
.card p { margin: 0; font-size: 18px; max-width: 68ch; }
.card .ctag { float: right; font-size: 13px; color: var(--mid); font-weight: 700; margin-left: 12px; }
.card pre { background: var(--code-bg); color: var(--code-ink); border-radius: 10px; padding: 12px 14px; overflow-x: auto; font: 13px/1.6 var(--mono); margin: 4px 0 0; }

.controls { position: sticky; bottom: 0; margin-top: 16px; background: var(--bg); border-top: 1px solid var(--line);
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.controls button, .controls select { font: 600 14px var(--sans); color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 14px; cursor: pointer; }
.controls button:disabled { opacity: .4; cursor: default; }
.controls button.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); min-width: 92px; }
.controls input[type=range] { flex: 1 1 160px; min-width: 120px; accent-color: var(--mid); }
.count { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; min-width: 64px; text-align: right; }
.hint { color: var(--muted); font-size: 12px; width: 100%; }
@media (max-width: 560px) {
  .cell .mark { width: 13px; height: 13px; font-size: 8px; right: -4px; bottom: -4px; }
  .cell { border-width: 1.5px; border-radius: 6px; } .cells, .grow { gap: 4px; }
  .stage { padding: 14px 10px; }
}
@media (prefers-reduced-motion: reduce) { .ptr, .cell, .axis .win { transition: none; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="eyebrow">Binary search · dry runs</div>
    <div class="picker">
      <button class="iconbtn" id="pprev" aria-label="Previous problem">‹</button>

      <button class="iconbtn" id="pnext" aria-label="Next problem">›</button>

  <div class="controls">

    <div class="hint">Keys: ← → step, Space play or pause, [ ] previous or next problem.</div>

</div>

<script>
const DATA = [{"slug": "lc-704", "num": 704, "family": "A. Classic search on a sorted array", "title": "704. Binary Search", "level": "Easy", "subtitle": "nums = [-1, 0, 3, 5, 9, 12]     target = 9", "rowLabel": null, "values": [-1, 0, 3, 5, 9, 12], "grid": null, "line": null, "showIndex": true, "ptrDefs": [{"name": "mid", "side": "down", "color": "mid"}, {"name": "low", "side": "up", "color": "low"}, {"name": "high", "side": "up", "color": "high"}], "code": {"search": ["public int search(int[] nums, int target) {", "    int low = 0, high = nums.length - 1;", "    while (low <= high) {", "        int mid = low + (high - low) / 2;", "        if (nums[mid] == target) return mid;", "        if (nums[mid] < target) low = mid + 1;", "        else high = mid - 1;", "    }", "    return -1;", "}"]}, "sigs": {"search": "public int search(int[] nums, int target)"}, "steps": [{"card": {"tag": "1 / 4  The problem", "sections": [{"head": "Problem", "text": "Given a sorted array of distinct integers and a target, return the target's index, or -1 if it isn't there. Must be O(log n)."}, {"head": "Example", "text": "nums = [-1,0,3,5,9,12], target = 9 → 4"}]}, "ms": 8320}, {"card": {"tag": "2 / 4  Before coding", "sections": [{"head": "How to spot it", "text": "Sorted array and an O(log n) requirement. This is the base case every other problem builds on."}, {"head": "Hint", "text": "Compare the middle with the target and throw away the half that can't contain it."}, {"head": "Key insight", "text": "If nums[mid] < target, everything at or left of mid is too small, so low = mid + 1. Otherwise go left."}]}, "ms": 14040}, {"ptrs": {"mid": null, "low": 0, "high": 5}, "gone": [], "marks": {}, "found": [], "status": "low = 0,   high = 5", "caption": "low and high mark the range where 9 could still be. At the start that is the whole array.", "tag": "Setup", "fn": "search", "hi": [1], "panel": null, "values": null, "window": null, "ms": 3000}, {"ptrs": {"mid": 2, "low": 0, "high": 5}, "gone" const $ = id => document.getElementById(id);

const ARROW_DOWN = '<svg viewBox="0 0 14 26" aria-hidden="true"><path d="M7 0v17" stroke="currentColor" stroke-width="3"/><path d="M0 15l7 11 7-11z" fill="currentColor"/></svg>';
const ARROW_UP = '<svg viewBox="0 0 14 26" aria-hidden="true"><path d="M7 26V9" stroke="currentColor" stroke-width="3"/><path d="M0 11L7 0l7 11z" fill="currentColor"/></svg>';

function buildPicker() {
  const fams = [];
  DATA.forEach((d, i) => { let f = fams.find(x => x.name === d.family); if (!f) fams.push(f = { name: d.family, items: [] }); f.items.push(i); });
  $("pick").innerHTML = fams.map(f => `<optgroup label="${esc(f.name)}">` +
    f.items.map(i => `<option value="${i}">${esc(DATA[i].title)}</option>`).join("") + `</optgroup>`).join("");

// ---------------------------------------------------------------- stage builders
function buildArray(s) {
  const vals = s.values || prob.values;
  const n = vals.length;
  const maxW = Math.min(Math.max(n, 3) * 84, 900);
  const ups = prob.ptrDefs.filter(d => d.side === "up"), downs = prob.ptrDefs.filter(d => d.side === "down");
  $("stage").innerHTML = `
    ${prob.rowLabel ? `<div class="rowlabel">${esc(prob.rowLabel)}</div>` : ""}
    <div class="status" id="status"></div>
    <div class="track ${prob.showIndex ? "has-idx" : ""}" style="max-width:${maxW}px">
      <div class="prow down">${downs.map(d => `<div class="ptr c-${d.color}" id="p-${d.name}">${esc(d.name)}${ARROW_DOWN}</div>`).join("")}</div>
      <div class="cells" style="grid-template-columns:repeat(${Math.max(n, 1)}, minmax(0,1fr))">
        ${vals.map((_, i) => `<div class="cell" id="c${i}"></div>`).join("")}
      </div>
      <div class="prow up">${ups.map(d => `<div class="ptr c-${d.color}" id="p-${d.name}">${ARROW_UP}${esc(d.name)}</div>`).join("")}</div>
    </div>
    <div class="panel" id="panel" hidden></div>`;
  built = prob.slug + ":array:" + n;
}

function buildGrid() {
  const rows = prob.grid.length, cols = prob.grid[0].length;
  $("stage").innerHTML = `
    ${prob.rowLabel ? `<div class="rowlabel">${esc(prob.rowLabel)}</div>` : ""}
    <div class="status" id="status"></div>
    <div class="gridwrap grid" style="max-width:${Math.min(cols * 92 + 60, 900)}px">
      ${prob.grid.map((row, r) => `<div class="rlab" id="rl${r}"></div><div class="grow" style="grid-template-columns:repeat(${cols}, minmax(0,1fr))">` +
        row.map((_, c) => `<div class="cell" id="c${r * cols + c}"></div>`).join("") + `</div>`).join("")}
    </div>
    <div class="panel" id="panel" hidden></div>`;
  built = prob.slug + ":grid";
}

function buildLine() {
  const L = prob.line;
  const ups = prob.ptrDefs.filter(d => d.side === "up"), downs = prob.ptrDefs.filter(d => d.side === "down");
  const ticks = [];
  const span = L.max - L.min;
  for (let k = 0; k <= 5; k++) ticks.push(L.min + span * k / 5);
  $("stage").innerHTML = `
    ${prob.rowLabel ? `<div class="rowlabel">${esc(prob.rowLabel)}</div>` : ""}
    <div class="status" id="status"></div>
    <div class="line-track">
      <div class="prow down">${downs.map(d => `<div class="ptr c-${d.color}" id="p-${d.name}">${esc(d.name)}${ARROW_DOWN}</div>`).join("")}</div>
      <div class="axis" id="axis"><div class="bar"></div><div class="win" id="win"></div>
        ${ticks.map(v => `<div class="tick" style="left:${(v - L.min) / span * 100}%">${L.decimals ? v.toFixed(1) : Math.round(v)}</div>`).join("")}
        <div id="dots"></div></div>
      <div class="prow up" style="margin-top:6px">${ups.map(d => `<div class="ptr c-${d.color}" id="p-${d.name}">${ARROW_UP}${esc(d.name)}</div>`).join("")}</div>
    </div>
    <div class="panel" id="panel" hidden></div>`;
  built = prob.slug + ":line";
}

// ---------------------------------------------------------------- render one step
function cellClass(i, s) {
  const m = s.marks[String(i)];
  const gone = s.gone.includes(i);
  return "cell" + (m ? " " + m : "") + (gone ? " gone" : "") + (s.found.includes(i) ? " found" : "");
}
function setMark(c, m) {
  let mk = c.querySelector(".mark");
  if (m === "yes" || m === "no") {
    if (!mk) { mk = document.createElement("span"); c.appendChild(mk); }
    mk.className = "mark " + m; mk.textContent = m === "yes" ? "✓" : "✕";
    mk.setAttribute("aria-label", m === "yes" ? "works" : "fails");
  } else if (mk) mk.remove();
}

function placeArrows(s, toPct) {
  const groups = {};
  prob.ptrDefs.forEach(d => {
    const el = $("p-" + d.name); if (!el) return;
    const pos = s.ptrs[d.name];
    if (pos === null || pos === undefined) { el.style.opacity = 0; return; }
    const key = d.side + ":" + Number(pos).toFixed(6);
    (groups[key] = groups[key] || []).push([el, pos]);
  });
  Object.values(groups).forEach(g => g.forEach(([el, pos], j) => {
    const nudge = (j - (g.length - 1) / 2) * 34;
    el.style.opacity = 1;
    el.style.left = `calc(${toPct(pos)}% + ${nudge}px)`;
  }));
}

function renderArray(s) {
  const vals = s.values || prob.values;
  const n = vals.length;
  if (built !== prob.slug + ":array:" + n) buildArray(s);
  vals.forEach((raw, i) => {
    const c = $("c" + i), cv = cellVal(raw);
    c.className = cellClass(i, s);
    c.innerHTML = `${esc(cv.v)}${cv.s ? `<span class="cs">${esc(cv.s)}</span>` : ""}${prob.showIndex ? `<span class="idx">${i}</span>` : ""}`;
    setMark(c, s.marks[String(i)]);
  });
  placeArrows(s, pos => ((pos + 0.5) / Math.max(n, 1)) * 100);
}

function renderGrid(s) {
  if (built !== prob.slug + ":grid") buildGrid();
  const cols = prob.grid[0].length;
  prob.grid.forEach((row, r) => row.forEach((v, c) => {
    const i = r * cols + c, el = $("c" + i);
    el.className = cellClass(i, s);
    const tags = prob.ptrDefs.filter(d => d.side === "cell" && s.ptrs[d.name] === i);
    el.innerHTML = `${esc(v)}` + (tags.length ? `<div class="tags">${tags.map(d => `<span class="bg-${d.color}">${esc(d.name)}</span>`).join("")}</div>` : "");
    setMark(el, s.marks[String(i)]);
  }));
  prob.grid.forEach((_, r) => {
    const tags = prob.ptrDefs.filter(d => d.side === "row" && s.ptrs[d.name] === r);
    $("rl" + r).innerHTML = tags.map(d => `<span class="bg-${d.color}">${esc(d.name)}</span>`).join("");
  });
}

function renderLine(s) {
  if (built !== prob.slug + ":line") buildLine();
  const L = prob.line, span = L.max - L.min;
  const pct = v => (v - L.min) / span * 100;
  const w = s.window || [L.min, L.max];
  const lo = Math.min(w[0], w[1]), hi = Math.max(w[0], w[1]);
  $("win").style.left = pct(lo) + "%";
  $("win").style.width = Math.max(pct(hi) - pct(lo), 0.6) + "%";
  $("win").style.opacity = w[0] > w[1] ? 0.35 : 1;
  $("dots").innerHTML = Object.entries(s.marks).map(([v, m]) => {
    const isFound = s.found.map(String).includes(v);
    return `<div class="dlab" style="left:${pct(+v)}%">${esc(v)}</div><div class="dot ${isFound ? "found" : "mark " + m}" style="left:${pct(+v)}%">${isFound ? "★" : m === "yes" ? "✓" : "✕"}</div>`;
  }).join("");
  placeArrows(s, pct);
}

function renderPanel(s) {
  const panel = $("panel");
  const p = s.panel;
  if (!p || (!p.title && !p.items.length && !p.result && !p.vars.length)) { panel.hidden = true; return; }
  panel.hidden = false;
  const r = p.result;
  panel.innerHTML = (p.title ? `<div class="ptitle">${esc(p.title)}</div>` : "") + `<div class="row">` +
    p.items.map(it => `<div class="pile ${it.hot ? "hot" : ""}"><b>${esc(it.label)}</b><span>${it.sub ? esc(it.sub) : "&nbsp;"}</span></div>`).join("") +
    (r ? `<div class="result ${r.ok === true ? "ok" : r.ok === false ? "bad" : ""}"><b>${esc(r.main)}</b><span>${esc(r.sub)}</span></div>` : "") +
    p.vars.map(([k, v]) => `<div class="var"><small>${esc(k)}</small><b>${esc(v)}</b></div>`).join("") + `</div>`;
}

function render() {
  const s = prob.steps[idx];
  $("family").textContent = prob.family;
  $("title").innerHTML = `${esc(prob.title)}<span class="lvl">${esc(prob.level)}</span>`;
  $("subtitle").textContent = prob.subtitle;
  $("count").textContent = `${idx + 1} / ${prob.steps.length}`;
  $("scrub").max = prob.steps.length - 1;
  $("scrub").value = idx;
  $("prev").disabled = idx === 0;
  $("next").disabled = idx === prob.steps.length - 1;
  $("pprev").disabled = pi === 0;
  $("pnext").disabled = pi === DATA.length - 1;

  if (s.card) {
    built = null;
    $("lower").hidden = true;
    $("stage").innerHTML = `<div class="card"><span class="ctag">${esc(s.card.tag)}</span>` +
      s.card.sections.map(sec => `<h2>${esc(sec.head)}</h2>` +
        (sec.code ? `<pre>${esc(sec.code.join("\n"))}</pre>` : `<p>${esc(sec.text)}</p>`)).join("") + `</div>`;
    return;
  }
  $("lower").hidden = false;
  const m = mode(prob);
  if (m === "grid") renderGrid(s); else if (m === "line") renderLine(s); else renderArray(s);
  $("status").textContent = s.status || "";
  renderPanel(s);
  $("tag").textContent = s.tag || "";
  $("caption").textContent = s.caption;
  $("fn").textContent = "running: " + s.fn + "()";
  const hi = new Set(s.hi);
  $("code").innerHTML = prob.code[s.fn].map((l, i) => `<span class="ln ${hi.has(i) ? "hi" : ""}">${esc(l) || " "}</span>`).join("");
}

// ---------------------------------------------------------------- playback
function go(i) { idx = Math.max(0, Math.min(prob.steps.length - 1, i)); render(); }
function schedule() {
  clearTimeout(timer);
  if (!playing) return;
  if (idx >= prob.steps.length - 1) { setPlaying(false); return; }
  timer = setTimeout(() => { go(idx + 1); schedule(); }, prob.steps[idx].ms / parseFloat($("speed").value));
}
function setPlaying(on) {
  playing = on;
  $("play").textContent = on ? "❚❚ Pause" : (idx >= prob.steps.length - 1 ? "↺ Replay" : "▶ Play");
  schedule();
}
$("play").onclick = () => { if (!playing && idx >= prob.steps.length - 1) go(0); setPlaying(!playing); };
$("prev").onclick = () => { setPlaying(false); go(idx - 1); setPlaying(false); };
$("next").onclick = () => { setPlaying(false); go(idx + 1); setPlaying(false); };
$("scrub").oninput = e => { setPlaying(false); go(+e.target.value); setPlaying(false); };
$("speed").onchange = () => schedule();
$("pick").onchange = e => { location.hash = DATA[+e.target.value].slug; };
$("pprev").onclick = () => { if (pi > 0) location.hash = DATA[pi - 1].slug; };
$("pnext").onclick = () => { if (pi < DATA.length - 1) location.hash = DATA[pi + 1].slug; };

  if (e.target.closest("input, select")) return;
  if (e.key === "ArrowRight") { e.preventDefault(); $("next").click(); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); $("prev").click(); }
  else if (e.key === " ") { e.preventDefault(); $("play").click(); }
  else if (e.key === "]") $("pnext").click();
  else if (e.key === "[") $("pprev").click();
});
function load() {
  const h = location.hash.slice(1);
  pi = Math.max(0, DATA.findIndex(d => d.slug === h));
  prob = DATA[pi]; idx = 0; built = null;
  $("pick").value = String(pi);
  setPlaying(false); render(); setPlaying(false);
}
window.addEventListener("hashchange", load);
buildPicker();
load();
