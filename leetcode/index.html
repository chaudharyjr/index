<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeetCode Revision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap">
<style>
:root { --bg:#f4f5f8; --surface:#fff; --ink:#1b2230; --muted:#5d6676; --line:#d6dbe3; --accent:#2f6fdf; }
@media (prefers-color-scheme: dark) { :root { --bg:#0f131b; --surface:#171c26; --ink:#e6e9ef; --muted:#98a1b2; --line:#2b3242; --accent:#6b9cff; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:"IBM Plex Sans", system-ui, sans-serif; line-height:1.5; }
main { max-width:720px; margin:0 auto; padding:48px 16px; }
h1 { font-size:2rem; margin:0 0 4px; }
.sub { color:var(--muted); margin:0 0 32px; }
a.card { display:block; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:20px; color:inherit; text-decoration:none; margin-bottom:12px; }
a.card:hover { border-color:var(--accent); }
a.card h2 { margin:0 0 4px; font-size:1.15rem; color:var(--accent); }
a.card p { margin:0; color:var(--muted); }
footer { margin-top:40px; color:var(--muted); font-size:.9rem; }
footer a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>LeetCode Revision</h1>
  <p class="sub">Step-through dry runs of LeetCode solutions in Java, grouped by pattern.</p>
  <a class="card" href="binary-search/">
    <h2>Binary Search</h2>
    <p>31 problems with step-by-step dry runs. Play, pause, step forward and back, and follow the Java code as it runs.</p>
  </a>
  <footer><a href="/">← shubhamchaudhary.me</a></footer>
</main>
</body>
</html>
